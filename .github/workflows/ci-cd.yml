name: E-Ticaret CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test-et:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Testleri Calistir
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          PYTHONPATH=. pytest

  paketle-ve-yukle:
    needs: test-et
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: GitHub Container Registry Girisi
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imaji Derle ve GHCR Yukle
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/zeynosh/e-ticaret-api:latest

  sunucuya-yukle:
    needs: paketle-ve-yukle
    runs-on: ubuntu-latest
    steps:
      - name: AWS EC2 Sunucusunu Guncelle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ghcr.io/zeynosh/e-ticaret-api:latest
            sudo docker rm -f e-ticaret-canli || true
            sudo docker run -d -p 8000:8000 --name e-ticaret-canli --restart always ghcr.io/zeynosh/e-ticaret-api:latest
            sudo docker image prune -f